name: Scan Semanal Competencia

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml pandas apify-client anthropic pillow openpyxl

      - name: Scrapear solo ofertas Casa Rica
        run: python scraper_casarica_v5.py --categoria "Ofertas"

      - name: Leer precios de imágenes IG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python leer_precios_imagenes.py --input ig_solo_ofertas.csv --limite 50

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_id }}
          path: resultados/
          retention-days: 30
